name: Java CI with Gradle

on: [ push ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      # Two toolchains, because 1.21.1 and 1.21.11 build on Java 21 and 26.1 onward on Java 25. Gradle picks
      # the right one per target from build.gradle.kts.
      - name: Set up JDK 21 and 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
          check-latest: true
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build every Minecraft version
        run: ./gradlew build --stacktrace

      # Mixin targets are strings javac never checks, so each is checked against the game it will be applied to.
      - name: Check mixin targets
        run: python3 tools/check-mixin-targets.py

      # One jar per target, but a target accepts older NeoForge builds than it compiles against, and 26.1
      # accepts older Minecraft too. Each is checked at the oldest build its metadata lets it load on.
      - name: Check each jar at the oldest build it accepts
        run: |
          check() {
            ./gradlew ":$1:writeCompileClasspath" -Pneo_version="$2" -Pminecraft_version="$3" --stacktrace
            python3 tools/check-linkage.py "$1" "$2"
            python3 tools/check-mixin-targets.py "$1" --neoforge "$2"
          }
          check 1.21.1 21.1.1 1.21.1
          check 1.21.11 21.11.1-beta 1.21.11
          check 26.1 26.1.0.1-beta 26.1
          check 26.1 26.1.1.0-beta 26.1.1
          check 26.1 26.1.2.0-beta 26.1.2
          check 26.2 26.2.0.1-beta 26.2
          check 26.3 26.3.0.1-beta 26.3

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: versions/*/build/libs/*.jar
