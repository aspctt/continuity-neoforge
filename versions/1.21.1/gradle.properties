# Everything specific to one Minecraft version lives here. Adding a target means adding a sibling
# directory, not editing this file.

# Latest versions: https://projects.neoforged.net/neoforged/neoforge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.249
neo_version_range=[21.1.0,)
loader_version_range=[4,)

# Parchment parameter names and javadoc.
# Latest versions: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17
resource_pack_format=34

# Sodium gained a config API in 0.8, so these are the targets whose Sodium build can show Continuity's
# options as a page of their own. The API artifact is compiled against; the mod itself is only added to
# the development run.
sodium_api_version=0.8.13+mc1.21.1
sodium_version=mc1.21.1-0.8.13-neoforge
